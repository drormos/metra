<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beat states through a bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FF3B30}
</style>
</helmet>
<div style="width: 390px; height: 330px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 22px; background: #000000; color: #8C8C8C; font-family: 'Saira', system-ui, sans-serif; font-size: 13px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div>On beat 1 (accent sounds)</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<div style="display: flex; flex-direction: column; gap: 5px"><div style="height: 36px; border-radius: 4px; background: #FF4A3D"></div><div style="display: flex; gap: 3px"><div style="flex: 1 1 0; height: 5px; background: #D0D0D0"></div><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 5px"><div style="height: 36px; border-radius: 4px; background: #3A3A3A"></div><div style="display: flex; gap: 3px"><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 5px"><div style="height: 36px; border-radius: 4px; background: #3A3A3A"></div><div style="display: flex; gap: 3px"><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 5px"><div style="height: 36px; border-radius: 4px; background: #1A1A1A; overflow: hidden"><svg width="100%" height="36" viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="36" x2="100" y2="0" stroke="#7A7A7A" stroke-width="2" vector-effect="non-scaling-stroke"></line></svg></div><div style="display: flex; gap: 3px"><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div>On beat 2 (regular beat sounds)</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<div style="display: flex; flex-direction: column; gap: 5px"><div style="height: 36px; border-radius: 4px; background: #8E2620"></div><div style="display: flex; gap: 3px"><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 5px"><div style="height: 36px; border-radius: 4px; background: #FFFFFF"></div><div style="display: flex; gap: 3px"><div style="flex: 1 1 0; height: 5px; background: #D0D0D0"></div><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 5px"><div style="height: 36px; border-radius: 4px; background: #3A3A3A"></div><div style="display: flex; gap: 3px"><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 5px"><div style="height: 36px; border-radius: 4px; background: #1A1A1A; overflow: hidden"><svg width="100%" height="36" viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="36" x2="100" y2="0" stroke="#7A7A7A" stroke-width="2" vector-effect="non-scaling-stroke"></line></svg></div><div style="display: flex; gap: 3px"><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div>On the “and” of beat 4 (muted beat, only its eighth sounds)</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<div style="display: flex; flex-direction: column; gap: 5px"><div style="height: 36px; border-radius: 4px; background: #8E2620"></div><div style="display: flex; gap: 3px"><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 5px"><div style="height: 36px; border-radius: 4px; background: #3A3A3A"></div><div style="display: flex; gap: 3px"><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 5px"><div style="height: 36px; border-radius: 4px; background: #3A3A3A"></div><div style="display: flex; gap: 3px"><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 5px"><div style="height: 36px; border-radius: 4px; background: #1A1A1A; overflow: hidden"><svg width="100%" height="36" viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="36" x2="100" y2="0" stroke="#7A7A7A" stroke-width="2" vector-effect="non-scaling-stroke"></line></svg></div><div style="display: flex; gap: 3px"><div style="flex: 1 1 0; height: 5px; background: #2A2A2A"></div><div style="flex: 1 1 0; height: 5px; background: #D0D0D0"></div></div></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":330}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
